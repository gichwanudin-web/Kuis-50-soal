// ============ LOGIKA KUIS ============
let playerName = "";
let currentIndex = 0;
let score = 0;
let answered = false;

const screenStart  = document.getElementById("screen-start");
const screenQuiz   = document.getElementById("screen-quiz");
const screenResult = document.getElementById("screen-result");

const nameInput   = document.getElementById("nameInput");
const startBtn    = document.getElementById("startBtn");
const restartBtn  = document.getElementById("restartBtn");

const progressBar = document.getElementById("progressBar");
const counter     = document.getElementById("counter");
const qText       = document.getElementById("qText");
const qSub        = document.getElementById("qSub");
const optionsBox  = document.getElementById("options");

const resultName = document.getElementById("resultName");
const scoreBig   = document.getElementById("scoreBig");
const pctBig     = document.getElementById("pctBig");

const LETTERS = ["A", "B", "C", "D", "E"];

startBtn.addEventListener("click", () => {
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.focus();
    nameInput.style.borderColor = "#e74c3c";
    return;
  }
  playerName = name;
  startQuiz();
});

nameInput.addEventListener("input", () => {
  nameInput.style.borderColor = "#ccd2e0";
});

nameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") startBtn.click();
});

restartBtn.addEventListener("click", () => {
  currentIndex = 0;
  score = 0;
  answered = false;
  nameInput.value = "";
  screenResult.classList.add("hidden");
  screenStart.classList.remove("hidden");
});

function startQuiz() {
  currentIndex = 0;
  score = 0;
  answered = false;
  screenStart.classList.add("hidden");
  screenResult.classList.add("hidden");
  screenQuiz.classList.remove("hidden");
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = QUESTIONS[currentIndex];

  counter.textContent = (currentIndex + 1) + " / " + QUESTIONS.length;
  progressBar.style.width = ((currentIndex) / QUESTIONS.length * 100) + "%";

  qText.textContent = q.q;
  qSub.textContent = q.sub;

  optionsBox.innerHTML = "";
  q.opts.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerHTML = '<span class="letter">' + LETTERS[i] + '.</span><span>' + opt + '</span>';
    div.addEventListener("click", () => selectAnswer(i));
    optionsBox.appendChild(div);
  });
}

function selectAnswer(selectedIndex) {
  if (answered) return;
  answered = true;

  // Tandai pilihan (tanpa menampilkan benar/salah)
  const optionEls = optionsBox.querySelectorAll(".option");
  optionEls.forEach((el, i) => {
    el.classList.add("disabled");
    if (i === selectedIndex) el.classList.add("selected");
  });

  // Hitung skor
  if (selectedIndex === QUESTIONS[currentIndex].ans) {
    score++;
  }

  // Auto next
  setTimeout(() => {
    currentIndex++;
    if (currentIndex < QUESTIONS.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 350);
}

function showResult() {
  screenQuiz.classList.add("hidden");
  screenResult.classList.remove("hidden");

  const total = QUESTIONS.length;
  const pct = Math.round((score / total) * 100);

  resultName.textContent = "Nama: " + playerName;
  scoreBig.textContent = score;
  pctBig.textContent = pct + "%";

  progressBar.style.width = "100%";
}
</script>
</body>
</html>
